services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: autora-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autora_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-autora_agent}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
      - ./docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autora} -d ${POSTGRES_DB:-autora_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autora-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - agent_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agent_pgdata:
  agent_redisdata:
